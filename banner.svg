<svg width="1000" height="220" viewBox="0 0 1000 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1000" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A1628"/>
      <stop offset="0.55" stop-color="#0E2145"/>
      <stop offset="1" stop-color="#0A1628"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#B8860B"/>
      <stop offset="0.5" stop-color="#FFD700"/>
      <stop offset="1" stop-color="#B8860B"/>
    </linearGradient>
    <radialGradient id="glow" cx="500" cy="110" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1D4ED8" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#0A1628" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="220" fill="url(#bg)"/>
  <rect width="1000" height="220" fill="url(#glow)"/>

  <!-- garis emas atas-bawah -->
  <rect x="0" y="0" width="1000" height="3" fill="url(#gold)"/>
  <rect x="0" y="217" width="1000" height="3" fill="url(#gold)"/>

  <!-- ornamen diamond kiri-kanan -->
  <g stroke="#D4AF37" stroke-width="2" fill="none">
    <path d="M60 110 L82 88 L104 110 L82 132 Z"/>
    <path d="M896 110 L918 88 L940 110 L918 132 Z"/>
  </g>
  <circle cx="82" cy="110" r="3.5" fill="#FFD700"/>
  <circle cx="918" cy="110" r="3.5" fill="#FFD700"/>

  <!-- nama -->
  <text x="500" y="98" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="52" font-weight="700" fill="url(#gold)" letter-spacing="4">MUBARAQ</text>

  <!-- subtitle -->
  <text x="500" y="140" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#93B4D9" letter-spacing="6">FULLSTACK DEVELOPER · DATA SCIENCE &amp; ANALYTICS</text>

  <!-- garis pemisah kecil -->
  <line x1="380" y1="162" x2="620" y2="162" stroke="url(#gold)" stroke-width="1.5"/>
</svg>
